spring:
  application:
    name: claimscore
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/claimscore}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/auth/realms/claimscore}

security:
  jwt:
    # Base64-encoded HMAC-SHA256 secret — override via JWT_SECRET env var in production.
    secret: ${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1lbm91Z2g=}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
  lockout:
    maxAttempts: ${LOCKOUT_MAX_ATTEMPTS:5}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
logging:
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%p","logger":"%c","message":"%m","correlationId":"%X{correlationId}"}%n'
