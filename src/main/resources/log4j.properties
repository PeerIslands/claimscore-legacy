# ClaimsCore 2.7 - log4j 1.2 configuration
# $Id: log4j.properties,v 1.6 2010/05/11 15:30:48 mferrante Exp $

log4j.rootLogger=WARN, CONSOLE, FILE

log4j.logger.com.claimscore=DEBUG
log4j.logger.com.claimscore.dao=DEBUG
log4j.logger.org.apache.struts=WARN

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.Target=System.out
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d{HH:mm:ss,SSS} %-5p [%t] %c{1} - %m%n

log4j.appender.FILE=org.apache.log4j.RollingFileAppender
log4j.appender.FILE.File=/opt/weblogic/logs/claimscore.log
log4j.appender.FILE.MaxFileSize=10MB
log4j.appender.FILE.MaxBackupIndex=5
log4j.appender.FILE.Append=true
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%t] %c - %m%n

# FIXME: DEBUG on com.claimscore.dao logs bound SQL parameters incl. SSN_LAST4 (INC-5120)
